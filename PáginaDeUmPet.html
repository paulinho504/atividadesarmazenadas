    <h1>Sobre o Shih Tzu</h1>
    <h2>Características</h2>
    <p>O Shih Tzu é uma raça de cachorro de pequeno porte, conhecida por sua aparência charmosa e pelagem longa e sedosa. 
    Eles são amigáveis, leais e se dão bem com crianças e outros animais de estimação.</p>
